name: Build Windows and Mac Executables

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: 1. Récupérer le code source
      uses: actions/checkout@v4

    - name: 2. Installer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path "requirements.txt") { pip install -r requirements.txt }

    - name: 4. Générer l'exécutable Windows
      run: |
        pyinstaller --onedir --noconsole main.py

    - name: 5. Sauvegarder le dossier Windows (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: texta-score-edit-v0.0.1.2-windows
        path: dist/main/

  build-macos:
    runs-on: macos-latest
    steps:
    - name: 1. Récupérer le code source
      uses: actions/checkout@v4

    - name: 2. Installer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

    - name: 4. Générer l'application macOS
      run: |
        pyinstaller --onedir --noconsole main.py

    - name: 5. Sauvegarder l'application macOS (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: texta-score-edit-v0.0.1.2-macos
        path: dist/main.app/