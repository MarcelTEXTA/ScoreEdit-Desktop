name: Build Windows Executable

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. Récupérer le code source
      uses: actions/checkout@v4

    - name: 2. Installer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path "requirements.txt") { pip install -r requirements.txt }

    - name: 4. Générer le fichier .exe avec PyInstaller
      run: |
        # Remplacez 'main.py' par le nom de votre script principal
        # Ajoutez l'option '--noconsole' si c'est une application avec interface graphique (GUI)
        pyinstaller --onefile --noconsole main.py

    - name: 5. Sauvegarder le fichier .exe (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: mon-executable-windows
        path: dist/*.exe