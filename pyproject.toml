[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texta-score-edit"
version = "0.1.0"
description = "Desktop music score editor"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15",
    "PyQtWebEngine>=5.15",
]

[project.scripts]
texta-score-edit = "scoreedit.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["scoreedit*"]

[tool.setuptools.package-data]
"scoreedit.resources" = [
    "config.json",
    "IconApp/*",
    "IconApp/**/*",
    "styles/*.css",
    "url/*.html",
    "url/*.css",
    "locales/*.qm",
    "locales/*.ts",
]